<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f8f8fa; }
    .header {
      background: linear-gradient(135deg, #2b2d42, #404258);
      color: #fff; padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header .title { font-size: 16px; font-weight: bold; }
    .header .sub { font-size: 11px; opacity: .7; margin-top: 2px; }
    .switch { position: relative; width: 44px; height: 24px; flex: none; cursor: pointer; }
    .switch input { display: none; }
    .slider {
      position: absolute; inset: 0; background: #777; border-radius: 24px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px; transition: .2s;
    }
    input:checked + .slider { background: #34a853; }
    input:checked + .slider::before { transform: translateX(20px); }

    .status { margin: 14px 16px 0; padding: 14px 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; }
    .status.safe { background: #e6f4ea; color: #1e7b34; border: 1px solid #b7dfc2; }
    .status.warn { background: #fff3e0; color: #a35c00; border: 1px solid #f2ddb8; }
    .status.block { background: #fdecea; color: #a11d16; border: 1px solid #f5c6c0; }
    .status.off { background: #eee; color: #666; border: 1px solid #ddd; }
    .status b { display: block; font-size: 14px; margin-bottom: 2px; }
    .status .url { word-break: break-all; font-size: 12px; opacity: .8; }

    .stats { display: flex; gap: 10px; margin: 14px 16px 0; }
    .stat {
      flex: 1; background: #fff; border-radius: 10px; padding: 12px 0; text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .stat .num { font-size: 22px; font-weight: bold; color: #d62828; }
    .stat .label { font-size: 11px; color: #888; margin-top: 2px; }

    .meta { margin: 12px 16px 0; font-size: 11px; color: #999; line-height: 1.8; }
    .meta b { color: #666; }

    .foot { display: flex; gap: 10px; padding: 14px 16px 16px; }
    .foot button {
      flex: 1; padding: 9px 0; font-size: 13px; border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit; background: #e8e8ed; color: #333;
    }
    .foot button:hover { background: #dcdce2; }
    .foot .primary { background: #d62828; color: #fff; }
    .foot .primary:hover { background: #b91f1f; }
    .events { margin: 0 16px 10px; font-size: 11px; color: #555; }
    .events div { padding: 4px 0; border-bottom: 1px dashed #e5e5e5; word-break: break-all; }
    .events .cat { color: #d62828; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">🦊 银狐防护</div>
      <div class="sub">SilverFox Guard · Chrome / Edge</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabledToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status safe" id="statusBox">加载中…</div>

  <div class="stats">
    <div class="stat"><div class="num" id="todayCount">-</div><div class="label">今日拦截</div></div>
    <div class="stat"><div class="num" id="totalCount">-</div><div class="label">累计拦截</div></div>
  </div>

  <div class="events" id="events"></div>

  <div class="meta">
    黑名单规模：<b id="blCount">-</b> 条 · 更新于 <b id="blUpdated">-</b><br>
    数据源：LGSRC / OTX / ThreatFox / CyberCrime / YYT / OpenPhish / URLhaus + 启发式规则
  </div>

  <div class="foot">
    <button id="btnOptions">⚙️ 设置</button>
    <button id="btnHelp">❓ 帮助</button>
    <button class="primary" id="btnUpdate">🔄 更新名单</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
